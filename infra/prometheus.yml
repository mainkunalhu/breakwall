global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Real gateway runs on the host (bun --filter gateway dev, :8787).
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8787"]
        labels: { service: "gateway" }

  - job_name: guardrails
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: { service: "guardrails" }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
