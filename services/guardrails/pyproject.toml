[project]
name = "breakwall-guardrails"
version = "0.0.0"
description = "BreakWall guardrails (FastAPI: regex + prompt-guard + judge)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.0", "httpx>=0.27", "groq>=0.11"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
