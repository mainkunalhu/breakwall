name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install
      - run: bunx @biomejs/biome@1.9.4 check .
      - run: bun --filter '*' run typecheck
      - run: bun --filter '*' test
  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { python-version: "3.12" }
      - run: uv run pytest -q
        working-directory: services/guardrails
      - run: uv run pytest -q
        working-directory: services/eval-runner
      - run: uvx ruff check services/
